---
layout: default
---
<div class="home">
  <p class="tagline">{{ site.description }}</p>
  <ul class="posts">
    {% for post in site.posts %}
      <li>
        <a href="{{ post.url | prepend: site.baseurl }}">{{ post.title }}</a>
        <span class="post-date">{{ post.date | date: '%Y %b %-d' }}</span>
      </li>
    {% endfor %}
  </ul>
</div>
